[project]
name = "unerring"
version = "0.1.0"
description = "Certified removal for logistic regression. Paper certifiers live in uncle/simplified."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy<2",
    # The pin keeps us on manylinux_2_17 wheels (glibc 2.17) so we can
    # run on CentOS 7 HPC clusters like Stanage. Newer scipy releases
    # ship manylinux_2_28-only wheels (glibc 2.28+).
    "scipy<1.16",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unerring", "data"]

[tool.pytest.ini_options]
pythonpath = [".", "uncle"]
